<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Defeat Procrastination</title>
  <style>
        :root {
      --bg1: #0b1220;
      --bg2: #111b33;
      --card: rgba(255, 255, 255, 0.06);
      --line: rgba(255, 255, 255, 0.14);
      --text: #e8eefc;
      --muted: #9db0d0;
      --accent: #2ee6c5;
      --accent-dark: #0b1220;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      color: var(--text);
      line-height: 1.5;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 32px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    h1 { margin: 0 0 6px; font-size: 2rem; letter-spacing: -0.02em; }
    .subtitle { margin: 0 0 24px; color: var(--muted); }

    input {
      width: 100%;
      padding: 14px 16px;
      font-size: 1rem;
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-bottom: 12px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input::placeholder { color: var(--muted); }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(46, 230, 197, 0.18);
    }

    button {
      font: inherit;
      cursor: pointer;
      border-radius: 12px;
      transition: transform 0.15s, background 0.2s, border-color 0.2s, opacity 0.2s;
    }
    button:active { transform: scale(0.98); }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    button:disabled { opacity: 0.5; cursor: wait; }

    .primary {
      width: 100%;
      padding: 14px;
      border: 0;
      background: var(--accent);
      color: var(--accent-dark);
      font-weight: 700;
    }
    .primary:hover { background: #5cf0d6; }

    .secondary {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }
    .secondary:hover { border-color: var(--accent); }

    #reasonButtons { margin-top: 20px; }
    #reasonButtons button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      margin: 8px 0;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border: 1px solid var(--line);
    }
    #reasonButtons button:hover { border-color: var(--accent); transform: translateX(4px); }

    #output { color: var(--muted); margin: 20px 0 0; }
    #fix, #step { padding: 14px 16px; border-radius: 12px; margin: 12px 0 0; }
    #fix { background: rgba(255, 255, 255, 0.06); }
    #step {
      background: rgba(46, 230, 197, 0.12);
      border: 1px solid rgba(46, 230, 197, 0.35);
      font-weight: 600;
    }

    #timer {
      font-size: 3rem;
      font-weight: 700;
      text-align: center;
      font-variant-numeric: tabular-nums;
      margin: 20px 0 0;
    }

    p:empty { display: none; }
    [hidden] { display: none !important; }

    #output, #fix, #step, #reasonButtons button { animation: rise 0.35s ease-out both; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
        
  </style>
</head>
<body>
  <h1>Defeat Procrastination</h1>
  <input type="text" id="task" placeholder="What are you avoiding?">
  <button id="go" class="primary">Next</button>
  <div id="reasonButtons"></div>
  <p id="output"></p>
  <p id="fix"></p>

  <p id="step"></p>
  <button id="aiStep" class="secondary" hidden>Make my step more specific</button>
  <p id="timer"></p>
  <button id="startTimer" class="secondary" hidden>Start 5-minute timer</button>
  

  <script>
    const reasons={
      boring: {
        label: "It's boring",
        fix: "Attach something fun to it, like music or a snack.",
        step:"Work on it until one song ends."

      },
      scary: {
        label: "I'm scared I'll do it badly",
        fix: "Give yourself permission to make a bad first version.",
         step: "Spend 5 minutes making the worst draft on purpose."
      },
      big: {
        label: "It feels too big",
        fix: "Shrink it until the first step feels silly.",
        step: "Do only the first two minutes."
      }

    };
    let currentReason = "";
    const go = document.getElementById("go");

    go.addEventListener("click", function () {
      const task = document.getElementById("task").value;
      document.getElementById("output").textContent = "You're avoiding: " + task;
      const box = document.getElementById("reasonButtons");
      box.innerHTML = "";

      for (const key in reasons) {
        const btn = document.createElement("button");
        btn.textContent = reasons[key].label;

        btn.addEventListener("click", function () {
            currentReason= reasons[key].label;
            document.getElementById("fix").textContent = reasons[key].fix;
            document.getElementById("step").textContent = "Your tiny first step: " + reasons[key].step;
            document.getElementById("aiStep").hidden = false;       // new
            document.getElementById("startTimer").hidden = false;   // new
          });
        box.appendChild(btn);
      }
    });

          let timerId = null;
            function startTimer() {
            // If a timer is already running, stop it first
            clearInterval(timerId);

            let secondsLeft = 300; 
            showTime(secondsLeft);

            timerId = setInterval(function () {
              secondsLeft--;
              showTime(secondsLeft);

              if (secondsLeft <= 0) {
                clearInterval(timerId);
                document.getElementById("timer").textContent = "Time's up! Did you start?";
              }
            }, 1000); // runs every 1000 ms
          }
          function showTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            document.getElementById("timer").textContent =
              mins + ":" + String(secs).padStart(2, "0");
          }

          document.getElementById("startTimer").addEventListener("click", startTimer);
          document.getElementById("aiStep").addEventListener("click", async function () {
          const task = document.getElementById("task").value.trim();
          const stepBox = document.getElementById("step");


          if (!task || !currentReason) {
            stepBox.textContent = "Type a task and pick a reason first.";
            return;
          }

          stepBox.textContent = "Thinking...";
           const aiBtn = document.getElementById("aiStep");   // new
            aiBtn.disabled = true;          
          try {
            const res = await fetch("PASTE-YOUR-WORKER-URL-HERE", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ task: task, reason: currentReason })
          });
          const data = await res.json();
          stepBox.textContent = data.step || "Couldn't get a custom step. Try again in a minute.";
        } catch (err) {
          stepBox.textContent = "Couldn't reach the AI. Your built-in step still works.";
          console.log(err);
        }
      });
  </script>
</body>
</html>
