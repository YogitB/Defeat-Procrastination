<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Defeat Procrastination</title>
  <style>
    
        :root {
      --bg1: #0b1220;
      --bg2: #111b33;
      --card: rgba(255, 255, 255, 0.06);
      --line: rgba(255, 255, 255, 0.14);
      --text: #e8eefc;
      --muted: #9db0d0;
      --accent: #2ee6c5;
      --accent-dark: #0b1220;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      color: var(--text);
      line-height: 1.5;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 32px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    h1 { margin: 0 0 6px; font-size: 2rem; letter-spacing: -0.02em; }
    .subtitle { margin: 0 0 24px; color: var(--muted); }

    input {
      width: 100%;
      padding: 14px 16px;
      font-size: 1rem;
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-bottom: 12px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input::placeholder { color: var(--muted); }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(46, 230, 197, 0.18);
    }

    button {
      font: inherit;
      cursor: pointer;
      border-radius: 12px;
      transition: transform 0.15s, background 0.2s, border-color 0.2s, opacity 0.2s;
    }
    button:active { transform: scale(0.98); }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    button:disabled { opacity: 0.5; cursor: wait; }

    .primary {
      width: 100%;
      padding: 14px;
      border: 0;
      background: var(--accent);
      color: var(--accent-dark);
      font-weight: 700;
    }
    .primary:hover { background: #5cf0d6; }

    .secondary {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }
    .secondary:hover { border-color: var(--accent); }

    #reasonButtons { margin-top: 20px; }
    #reasonButtons button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      margin: 8px 0;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border: 1px solid var(--line);
    }
    #reasonButtons button:hover { border-color: var(--accent); transform: translateX(4px); }

    #output { color: var(--muted); margin: 20px 0 0; }
    #fix, #step { padding: 14px 16px; border-radius: 12px; margin: 12px 0 0; }
    #fix { background: rgba(255, 255, 255, 0.06); }
    #step {
      background: rgba(46, 230, 197, 0.12);
      border: 1px solid rgba(46, 230, 197, 0.35);
      font-weight: 600;
    }

    #timer {
      font-size: 3rem;
      font-weight: 700;
      text-align: center;
      font-variant-numeric: tabular-nums;
      margin: 20px 0 0;
    }

    p:empty { display: none; }
    [hidden] { display: none !important; }

    #output, #fix, #step, #reasonButtons button { animation: rise 0.35s ease-out both; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
      .chat { margin-top: 16px; border: 1px solid var(--line); border-radius: 16px; padding: 14px; background: rgba(0, 0, 0, 0.2); }
  .chat-log { display: flex; flex-direction: column; gap: 10px; max-height: 280px; overflow-y: auto; padding: 4px; }
  .bubble { max-width: 85%; padding: 10px 14px; border-radius: 16px; animation: rise 0.25s ease-out both; overflow-wrap: anywhere; }
  .bubble.user { align-self: flex-end; background: var(--accent); color: var(--accent-dark); border-bottom-right-radius: 4px; }
  .bubble.ai { align-self: flex-start; background: rgba(255, 255, 255, 0.1); border-bottom-left-radius: 4px; }
  .dots { display: inline-flex; gap: 4px; padding: 4px 0; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
  .dots i:nth-child(2) { animation-delay: 0.15s; }
  .dots i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
  .chat-row { display: flex; gap: 8px; margin-top: 12px; }
  .chat-row input { margin: 0; flex: 1; }
  .chat-send { padding: 0 18px; border: 0; background: var(--accent); color: var(--accent-dark); font-weight: 700; }
  .chat-send:disabled { opacity: 0.5; }
  .hint { margin: 8px 0 0; font-size: 0.8rem; color: var(--muted); }
  .prompt { margin-top: 16px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255, 255, 255, 0.05); }
  .prompt p { margin: 0 0 8px; font-weight: 600; }
  .stats { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); }
  .stats h2 { margin: 0 0 12px; font-size: 1.1rem; }
  .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .stat-row span:first-child { color: var(--muted); }
  .insight { margin-top: 12px; color: var(--muted); }
  #technique { font-size: 0.9rem; color: var(--muted); margin: 8px 0 0; }
  #technique strong { color: var(--accent); } 
  .plan-card { margin-top: 12px; display: grid; gap: 8px; }
  .plan-card:empty { display: none; }
  .plan-line { padding: 12px 14px; border-radius: 12px; background: rgba(255, 255, 255, 0.06); border-left: 4px solid var(--accent); animation: rise 0.3s ease-out both; }
  .plan-line strong { display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); } 
  </style>
</head>
<body>
  <h1>Defeat Procrastination</h1>
  <input type="text" id="task" placeholder="What are you avoiding?">
  <button id="go" class="primary">Next</button>
  <div id="reasonButtons"></div>
  <p id="output"></p>
  <p id="fix"></p>
  <p id="technique"></p>
  <p id="step"></p>
  <button id="aiStep" class="secondary" hidden>Make my step more specific</button>
  <section id="chat" class="chat" hidden>
  <div id="chatLog" class="chat-log" aria-live="polite"></div>
  <div class="chat-row">
    <input type="text" id="chatInput" placeholder="Ask a follow-up...">
    <button id="chatSend" class="chat-send">Send</button>
  </div>
  <p class="hint">This is a study helper, not therapy. If you're feeling really overwhelmed or down, talk to a trusted adult or school counselor. Please don't type personal information.</p>
</section>
  <p id="timer"></p>
  <button id="startTimer" class="secondary" hidden>Start 5-minute timer</button>
  <p id="planOut"></p>
  <button id="planCraft" class="primary">Craft my plan</button>
  <div id="planCraftOut" class="plan-card"></div> 
  <p>Make an if-then plan</p>
  <label for="planWhen" class="hint">When will you do it?</label>
  <input type="text" id="planWhen" placeholder="e.g. after dinner">
  <label for="planWhere" class="hint">Where?</label>
  <input type="text" id="planWhere" placeholder="e.g. at my desk">
  <button id="planSave" class="secondary">Lock in my plan</button>
  <p id="planOut"></p>
</div>

<div id="startedPrompt" class="prompt" hidden>
  <p>Time's up. Did you start?</p>
  <button id="yes" class="primary">Yes, I started</button>
  <button id="no" class="secondary">Not yet</button>
</div>
<p id="kindNote" class="insight"></p>

<section class="stats">
  <h2>Your pattern</h2>
  <div id="statsBody"></div>
</section>
  

  <script>
    const reasons = {
  boring: {
    label: "It's boring",
    technique: "Temptation bundling",
    why: "Pairing a boring task with something you enjoy makes starting feel less costly.",
    fix: "Attach something you like to it, such as a playlist, a snack, or a good seat.",
    step: "Start your favorite playlist and work until the first song ends."
  },
  scary: {
    label: "I'm scared I'll do it badly",
    technique: "Self-compassion and a good-enough draft",
    why: "Being hard on yourself makes avoidance worse. Kindness makes starting easier.",
    fix: "Your first version is allowed to be bad. That's its job.",
    step: "Spend 5 minutes writing the worst possible version on purpose."
  },
  confusing: {
    label: "I don't know where to start",
    technique: "If-then planning",
    why: "Deciding when and where you'll act removes the in-the-moment decision.",
    fix: "Confusion is a missing plan, not a missing skill. Write questions, not answers.",
    step: "Write down 3 questions you have about it. Don't answer them yet."
  },
  big: {
    label: "It feels too big",
    technique: "Task breakdown",
    why: "Motivation often follows action. A tiny start gets you moving.",
    fix: "Shrink it until the first step feels almost silly.",
    step: "Open what you need and do only the first two minutes."
  },
  tired: {
    label: "I'm too tired",
    technique: "Minimum version and rest check",
    why: "Pushing on empty usually backfires. A tiny version, or planned rest, works better.",
    fix: "Do the smallest possible version, or choose rest on purpose and set a time to return.",
    step: "Drink some water and write one sentence about what's left to do."
  }
};
    const go = document.getElementById("go");
    let currentReason= "";
    let currentStep="";


    go.addEventListener("click", function () {
      const task = document.getElementById("task").value;
      document.getElementById("output").textContent = "You're avoiding: " + task;
      const box = document.getElementById("reasonButtons");
      box.innerHTML = "";

      for (const key in reasons) {
        const btn = document.createElement("button");
        btn.textContent = reasons[key].label;

        btn.addEventListener("click", function () {
            currentReason= reasons[key].label;
            document.getElementById("fix").textContent = reasons[key].fix;
            document.getElementById("step").textContent = "Your tiny first step: " + reasons[key].step;
            document.getElementById("aiStep").hidden = false;       // new
            document.getElementById("startTimer").hidden = false;   // new
            currentStep = reasons[key].step;
            const tech = document.getElementById("technique");
            tech.textContent = "";
            const strong = document.createElement("strong");
            strong.textContent = reasons[key].technique + ": ";
            tech.append(strong, reasons[key].why);
            document.getElementById("planBox").hidden = false;
          });

        box.appendChild(btn);
      }
    });

          let timerId = null;
            function startTimer() {
            // If a timer is already running, stop it first
            clearInterval(timerId);
            document.getElementById("startedPrompt").hidden = true;
            document.getElementById("kindNote").textContent = "";


            let secondsLeft = 300; 
            showTime(secondsLeft);

            timerId = setInterval(function () {
              secondsLeft--;
              showTime(secondsLeft);

              if (secondsLeft <= 0) {
                clearInterval(timerId);
                document.getElementById("timer").textContent = "0:00";
                document.getElementById("startedPrompt").hidden = false;
              }
            }, 1000); // runs every 1000 ms
          }
          function showTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            document.getElementById("timer").textContent =
              mins + ":" + String(secs).padStart(2, "0");
          }

          document.getElementById("startTimer").addEventListener("click", startTimer);
          const WORKER_URL = "https://procrastination-ai.yogirith41.workers.dev/";
const chat = document.getElementById("chat");
const chatLog = document.getElementById("chatLog");
const chatInput = document.getElementById("chatInput");
const chatSend = document.getElementById("chatSend");
let chatHistory = [];
let chatTask = "";

function addBubble(role, text) {
  const div = document.createElement("div");
  div.className = "bubble " + role;
  div.textContent = text;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
  return div;
}

function typeText(el, text) {
  return new Promise(function (resolve) {
    let i = 0;
    const t = setInterval(function () {
      i++;
      el.textContent = text.slice(0, i);
      chatLog.scrollTop = chatLog.scrollHeight;
      if (i >= text.length) {
        clearInterval(t);
        resolve();
      }
    }, 18);
  });
}

async function sendToAI(userText) {
  addBubble("user", userText);
  chatHistory.push({ role: "user", content: userText });
  chatInput.disabled = true;
  chatSend.disabled = true;

  const bubble = addBubble("ai", "");
  bubble.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';

  try {
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        task: chatTask,
        reason: currentReason,
        messages: chatHistory.slice(-9)
      })
    });
    const data = await res.json();

    if (data.reply) {
      bubble.textContent = "";
      await typeText(bubble, data.reply);
      chatHistory.push({ role: "assistant", content: data.reply });
    } else {
      bubble.textContent = "Hmm, I couldn't come up with anything. Try asking again.";
      chatHistory.pop();
    }
  } catch (err) {
    bubble.textContent = "Couldn't reach the AI. Your built-in step above still works.";
    chatHistory.pop();
    console.log(err);
  }

  chatInput.disabled = false;
  chatSend.disabled = false;
  chatInput.focus();
}
// ---- If-then plan ----
const PLAN_KEY = "defeat-procrastination-plan";

function showPlan(plan) {
  document.getElementById("planOut").textContent =
    "Your plan: When " + plan.when + ", at " + plan.where + ", I will " + plan.step.charAt(0).toLowerCase() + plan.step.slice(1);
}

document.getElementById("planSave").addEventListener("click", function () {
  const when = document.getElementById("planWhen").value.trim();
  const where = document.getElementById("planWhere").value.trim();
  const out = document.getElementById("planOut");

  if (!when || !where) {
    out.textContent = "Fill in both when and where.";
    return;
  }

  const plan = { when: when, where: where, step: currentStep };
  try { localStorage.setItem(PLAN_KEY, JSON.stringify(plan)); }
  catch (e) { console.log(e); }
  showPlan(plan);
});
function builtInPlan() {
  return [
    ["Start", currentStep],
    ["Then", "Keep going until the 5-minute timer ends. Messy is fine."],
    ["Done when", "The timer ends. You're allowed to stop, and anything more is a bonus."],
    ["If stuck", "Make the step even smaller, or breathe for a minute and try again."]
  ];
}

function parsePlan(text) {
  const labels = ["Start", "Then", "Done when", "If stuck"];
  const lines = text.split("\n").map(function (l) { return l.trim(); }).filter(Boolean);
  const out = [];
  labels.forEach(function (label) {
    const line = lines.find(function (l) {
      return l.toLowerCase().startsWith(label.toLowerCase() + ":");
    });
    if (line) out.push([label, line.slice(label.length + 1).trim()]);
  });
  return out.length === 4 ? out : null;
}

function renderPlan(parts) {
  const box = document.getElementById("planCraftOut");
  box.innerHTML = "";
  parts.forEach(function (p) {
    const row = document.createElement("div");
    row.className = "plan-line";
    const label = document.createElement("strong");
    label.textContent = p[0];
    row.append(label, p[1]);
    box.appendChild(row);
  });
}

document.getElementById("planCraft").addEventListener("click", async function () {
  const when = document.getElementById("planWhen").value.trim();
  const where = document.getElementById("planWhere").value.trim();
  const task = document.getElementById("task").value.trim();
  const out = document.getElementById("planOut");

  if (!task || !currentReason) {
    out.textContent = "Type a task and pick a reason first.";
    return;
  }
  if (!when || !where) {
    out.textContent = "Fill in both when and where first.";
    return;
  }

  const btn = document.getElementById("planCraft");
  btn.disabled = true;
  btn.textContent = "Crafting...";
  out.textContent = "Crafting your plan for " + when + " at " + where + "...";

  let parts = null;
  try {
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode: "plan", task: task, reason: currentReason, when: when, where: where })
    });
    const data = await res.json();
    if (data.reply) parts = parsePlan(data.reply);
  } catch (err) {
    console.log(err);
  }

  if (!parts) {
    parts = builtInPlan();
    out.textContent = "Here's a built-in plan (the AI couldn't answer right now):";
  } else {
    out.textContent = "Your plan for " + when + " at " + where + ":";
  }

  renderPlan(parts);
  btn.disabled = false;
  btn.textContent = "Craft it again";
});

// ---- Saved log and stats ----
const LOG_KEY = "defeat-procrastination-log";

function loadLog() {
  try { return JSON.parse(localStorage.getItem(LOG_KEY)) || []; }
  catch (e) { return []; }
}

function saveLog(log) {
  try { localStorage.setItem(LOG_KEY, JSON.stringify(log)); }
  catch (e) { console.log(e); }
}

function recordResult(started) {
  const log = loadLog();
  log.push({
    reason: currentReason,
    started: started,
    date: new Date().toISOString().slice(0, 10)
  });
  saveLog(log);
  document.getElementById("startedPrompt").hidden = true; 
  
  renderStats();
  try {
    const saved = JSON.parse(localStorage.getItem(PLAN_KEY));
    if (saved) {
      document.getElementById("planBox").hidden = false;
      showPlan(saved);
    }
  } catch (e) { console.log(e); }
}

function addRow(parent, label, value) {
  const row = document.createElement("div");
  row.className = "stat-row";
  const a = document.createElement("span");
  const b = document.createElement("span");
  a.textContent = label;
  b.textContent = value;
  row.append(a, b);
  parent.appendChild(row);
}

function renderStats() {
  const body = document.getElementById("statsBody");
  body.innerHTML = "";
  const log = loadLog();

  if (log.length === 0) {
    body.textContent = "Nothing yet. Finish a timer and your pattern will show up here.";
    return;
  }

  const startedCount = log.filter(function (x) { return x.started; }).length;
  const counts = {};
  log.forEach(function (x) { counts[x.reason] = (counts[x.reason] || 0) + 1; });
  const top = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; })[0];

  addRow(body, "Timers finished", log.length);
  addRow(body, "Times you started", startedCount + " (" + Math.round(startedCount / log.length * 100) + "%)");
  addRow(body, "Most common reason", top);

  const note = document.createElement("p");
  note.className = "insight";
  note.textContent = "Your most common block is \"" + top + "\". Try picking that reason first next time.";
  body.appendChild(note);
}

document.getElementById("yes").addEventListener("click", function () {
  recordResult(true);
  document.getElementById("kindNote").textContent =
    "Nice. Starting is the hardest part, and you did it.";
});

document.getElementById("no").addEventListener("click", function () {
  recordResult(false);
  document.getElementById("kindNote").textContent =
    "That's okay. Everyone gets stuck. Try an even smaller step, or pick a time to try again.";
});

renderStats();
document.getElementById("aiStep").addEventListener("click", function () {
  const task = document.getElementById("task").value.trim();
  if (!task || !currentReason) {
    document.getElementById("step").textContent = "Type a task and pick a reason first.";
    return;
  }
  chatTask = task;
  chatHistory = [];
  chatLog.innerHTML = "";
  chat.hidden = false;
  chat.scrollIntoView({ behavior: "smooth", block: "nearest" });
  sendToAI("I'm avoiding \"" + task + "\" because: " + currentReason + ". What's one tiny first step?");
});

chatSend.addEventListener("click", function () {
  const text = chatInput.value.trim();
  if (!text) return;
  chatInput.value = "";
  sendToAI(text);
});

chatInput.addEventListener("keydown", function (e) {
  if (e.key === "Enter") chatSend.click();
});
  </script>
</body>
</html>
